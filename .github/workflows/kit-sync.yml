# .github/workflows/kit-sync.yml — keep the kit's generated Resources current in the ops team (REPO-DESIGN.md §8.2
# "Keeping the generated Resources current", §15.4; kit/resources/README.md).
#
# After day 1 the repository's lifecycle, catalog, config (entitlements) and ceilings keep changing; the Resources that
# [KIT] 00 sections B, C and D read must follow. On a merge to main that changes one of their sources (the `paths`
# below: exactly what kit_bundle.py builds sdlc_state_machine, kit_catalog, kit_config and sdlc_limits from), and on
# dispatch:
#   ./scripts/kit sync-resources --env prod
#     under the sdlc_sync_lock compare-and-swap (POST /api/v1/global_resources/{id}/replace, if_value: free; a 422 means
#     a tracker sync holds it — retried, then the run stops without writing):
#       PUT /api/v1/global_resources/{id}                 sdlc_state_machine, kit_catalog, kit_config — whole value;
#                                                         kit_config keeps tenant_host (= $TINES_TENANT.tines.com) and
#                                                         environment: prod, which never come from git
#       POST …/{sdlc_limits}/replace                      every key it owns — never `enabled` or `guards_confirmed`,
#                                                         which only people set
#       POST …/{kit_state}/replace                        hash_<name> for each Resource = sdlc_common.resource_hash of its
#                                                         bundle-form value (kit/bundle/kit-bundle.json resources[].value);
#                                                         resources_in_sync compares them nightly (tracker-pull.yml)
#     then releases the lock (also on failure). Resource ids come from the committed kit/tenant/setup-report.json.
# The Tines Agent Skills are NOT pushed here. The ops team IS the prod team, so a skill push changes production agent
# behaviour with no Tines-side approval; skills reach it only through skills.yml, whose `production` environment keeps
# its required reviewers. Attaching a skill to an action stays [BY HAND] (no API found, VERIFY #14).
#
# Identity (GitHub environment `kit-sync`, deployment branches limited to main, REQUIRED REVIEWERS — security-platform,
# with "Prevent self-reviews": a run writes the prod team's Resources, and kit/tenant/config.yaml can reach main
# without a PR on day 1 ([KIT] 00 A16), so a person releases every run):
#   TINES_API_KEY_KIT_SYNC   an ops-team, TEAM-scoped Editor key used by this workflow only (policies/POLICY.md, kit-sync)
#   TINES_TENANT             the tenant host prefix
# Until the repository is provisioned (kit/tenant/config.yaml and setup-report.json exist) and the key exists, the job
# stops with a notice — the template repository never calls a tenant.

name: kit-sync

on:
  push:
    branches: [main]
    paths: # the sources of the four synced Resources (scripts/kit_bundle.py bundle_resource_values)
      - "sdlc/lifecycle/**"
      - "kit/catalog/**"
      - "kit/tracker/milestones.yaml" # kit_catalog.milestones
      - "kit/records/*.record-type.json" # the enums in sdlc_state_machine
      - "kit/tenant/config.yaml"
      - "policies/cost-ceilings.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sync:
    name: generated Resources → the ops team
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kit-sync
    env:
      TINES_TENANT: ${{ secrets.TINES_TENANT }}
      TINES_ENV: prod
      TINES_ALLOW_PROD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r scripts/requirements.txt

      - name: Provisioned, and the key configured?
        id: gate
        env:
          HAS_KEY: ${{ secrets.TINES_API_KEY_KIT_SYNC != '' }}
        run: |
          if [ ! -f kit/tenant/config.yaml ] || [ ! -f kit/tenant/setup-report.json ]; then
            echo "::notice::not a provisioned repository (kit/tenant/config.yaml or setup-report.json is missing); nothing to sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != "true" ] || [ -z "${TINES_TENANT:-}" ]; then
            echo "::notice::TINES_API_KEY_KIT_SYNC or TINES_TENANT is not set in the environment 'kit-sync'; nothing to sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the generated Resources (under sdlc_sync_lock)
        if: steps.gate.outputs.skip != 'true'
        env:
          TINES_API_KEY: ${{ secrets.TINES_API_KEY_KIT_SYNC }}
        run: |
          set -euo pipefail
          ./scripts/kit sync-resources --env prod | tee "$RUNNER_TEMP/sync.json"
          {
            echo "## kit-sync — ${GITHUB_SHA::7}"
            echo
            echo '```json'; cat "$RUNNER_TEMP/sync.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
