# .github/workflows/sdlc.yml — THE one required check (REPO-DESIGN.md §15.1, §3.3 row 18, §4.5, §6.5).
#
# On every pull request, with NO paths filter, so it reports on tracker and kit PRs too. Branch protection on `main`
# requires exactly one check: the job named `sdlc` at the bottom, which is green only when everything it depends on is.
#
#   route    which of lint.yml / review.yml this PR needs: their own path lists (the `sdlc-call-paths` blocks in those
#            files, read from the BASE branch so a PR cannot drop itself out of lint) against the PR's changed paths
#   checks   ./scripts/sdlc run from the BASE branch's code against the PR's tree:
#              check --all --strict     the contract-checker registry on the PR's own files (every SKIP of a planned
#                                       input is a FAIL here)
#              check --pr               with the lifecycle RULES from the base branch (--config-root), so a PR cannot
#                                       widen its own touch set: the touch set by branch prefix (design/, story/,
#                                       improve/, rollback/, tracker/; any other branch may not touch kit/tracker/**
#                                       or sdlc/work/**) · a build PR only when the row on main is in build · every
#                                       changed tracker row at main's rev + 1 · events.jsonl append-only, new lines
#                                       schema-valid · each added gate_decision event approved per
#                                       sdlc/gates/approvers.yaml · `sdlc ready` (G1 + GB) on a design PR ·
#                                       `sdlc estimate --check` and the "QA verification: pass · by <role>" line on a
#                                       G4 PR · a held-out cases file for every changed Tines Agent Skill
#   guard    a PR that changes .github/workflows/** or scripts/** fails here until it carries an approving
#            security-platform review (reviewDecision APPROVED, which with branch protection's "Require review from
#            Code Owners" means a CODEOWNER of /.github/ and /scripts/ — security-platform — approved; VERIFY that
#            setting). On pull_request a local `uses:` resolves to the PR's OWN copy of lint.yml and review.yml, so
#            lint and review wait for the guard: a PR's edited workflow never meets ANTHROPIC_API_KEY or a write token
#            before that review. After the review, re-run the failed jobs.
#   lint     calls lint.yml   (workflow_call) when its paths match; lint.yml runs the BASE branch's scripts/
#   review   calls review.yml (workflow_call) when its paths match — the only model in this workflow, and it is
#            review.yml's own, unchanged (off without ANTHROPIC_API_KEY)
#   sdlc     the required check: route, guard and checks green, lint and review green or skipped
#
# Residual (VERIFY): a pull_request run always executes the PR's own copy of THIS file, so a PR that edits sdlc.yml
# can drop the guard for its own run; CODEOWNERS (/.github/** → security-platform) holds the merge, not that run.
# Keeping secrets in GitHub environments with required reviewers is what protects them from such a run.
#
# It runs no model itself and touches no tenant. Network: the GitHub API (gh pr view, for the PR body and reviews) and
# PyPI for the scripts' two dependencies, as lint.yml. The PR body is read at run time, not from the event payload:
# after filling in the QA verification line, re-run the failed jobs of this workflow (a body edit is not a trigger,
# so an edit can never replace a failing review with a green run).
#
# Supply chain: actions are referenced by major tag; the security-platform owner pins each `uses:` to a verified
# full commit SHA (VERIFY — the SHAs are not recorded in this repository; never invent one).

name: sdlc

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write # lint.yml's semantic-diff comment and review.yml's findings comment (a called workflow cannot exceed this)
  issues: read # review.yml

concurrency:
  group: sdlc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  route:
    name: route (which called workflows this PR needs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lint: ${{ steps.route.outputs.lint }}
      review: ${{ steps.route.outputs.review }}
      sensitive: ${{ steps.route.outputs.sensitive }}
    steps:
      - name: Check out the pull request (full history for the diff against the base)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match the changed paths against lint.yml's and review.yml's own path lists (from the base branch)
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          base = os.environ["BASE_SHA"]
          changed = subprocess.run(["git", "diff", "--name-only", "--no-renames", f"{base}...HEAD"],
                                   capture_output=True, text=True, check=True).stdout.splitlines()

          def call_paths(workflow):
              """The list between `# sdlc-call-paths begin` and `end` — the base branch's copy, else this PR's."""
              for source in ("base", "head"):
                  if source == "base":
                      p = subprocess.run(["git", "show", f"{base}:.github/workflows/{workflow}"], capture_output=True, text=True)
                      text = p.stdout if p.returncode == 0 else ""
                  else:
                      path = f".github/workflows/{workflow}"
                      text = open(path, encoding="utf-8").read() if os.path.exists(path) else ""
                  m = re.search(r"#\s*sdlc-call-paths begin\n(.*?)#\s*sdlc-call-paths end", text, re.S)
                  if m:
                      return re.findall(r'-\s*"([^"]+)"', m.group(1)), source
              return None, None

          def glob_rx(g):
              out = ""
              i = 0
              while i < len(g):
                  if g.startswith("**", i):
                      out += ".*"
                      i += 2
                  elif g[i] == "*":
                      out += "[^/]*"
                      i += 1
                  else:
                      out += re.escape(g[i])
                      i += 1
              return re.compile("^" + out + "$")

          outputs = {}
          for key, wf in (("lint", "lint.yml"), ("review", "review.yml")):
              paths, source = call_paths(wf)
              if paths is None:
                  print(f"::warning title=sdlc::{wf} carries no sdlc-call-paths block; calling it on every PR")
                  outputs[key] = "true"
                  continue
              hits = [c for c in changed if any(glob_rx(g).match(c) for g in paths)]
              outputs[key] = "true" if hits else "false"
              print(f"{wf} ({source} list): {len(hits)} matching path(s) of {len(changed)}")
          # the code the gates run: a change here waits for a security-platform review (the guard job)
          sensitive = [c for c in changed if c.startswith((".github/workflows/", "scripts/"))]
          outputs["sensitive"] = "true" if sensitive else "false"
          print(f"workflow or script changes: {len(sensitive)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for k, v in outputs.items():
                  fh.write(f"{k}={v}\n")
          PY

  checks:
    name: lifecycle checks (registry, touch sets, rev, events, gates, readiness, cost, QA line)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gh pr view (the body and the reviews)
    steps:
      - name: Check out the pull request (DATA — full history)
        uses: actions/checkout@v6
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the base branch (the CODE and the lifecycle RULES that judge the PR)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the scripts' dependencies (the base branch's requirements.txt, never the PR's)
        run: |
          if [ -f base/scripts/requirements.txt ]; then
            python -m pip install --quiet -r base/scripts/requirements.txt
          else
            python -m pip install --quiet -r pr/scripts/requirements.txt
          fi

      - name: Which code runs (the base branch's, unless this PR introduces the lifecycle)
        id: code
        run: |
          if [ -f base/scripts/sdlc_checks.py ] && [ -f base/sdlc/lifecycle/state-machine.yaml ]; then
            echo "scripts=${GITHUB_WORKSPACE}/base/scripts" >> "$GITHUB_OUTPUT"
            echo "rules=${GITHUB_WORKSPACE}/base" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=sdlc::the base branch has no lifecycle yet (this PR introduces it): the PR's own scripts and rules are used once"
            echo "scripts=${GITHUB_WORKSPACE}/pr/scripts" >> "$GITHUB_OUTPUT"
            echo "rules=${GITHUB_WORKSPACE}/pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the pull request (body, author, reviews, head commit) at run time
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: pr
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json body,author,reviews,headRefOid,headRefName > "$RUNNER_TEMP/pr.json"
          echo "read PR #${PR_NUMBER}: $(jq '.reviews | length' "$RUNNER_TEMP/pr.json") review(s)"

      - name: The contract-checker registry on the PR's own files (check --all --strict)
        working-directory: pr
        env:
          SCRIPTS: ${{ steps.code.outputs.scripts }}
        run: python3 "$SCRIPTS/sdlc_checks.py" --root . --all --strict

      - name: The pull-request checks, with the base branch's lifecycle rules (check --pr)
        if: always()
        working-directory: pr
        env:
          SCRIPTS: ${{ steps.code.outputs.scripts }}
          RULES: ${{ steps.code.outputs.rules }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 "$SCRIPTS/sdlc_checks.py" --root . --config-root "$RULES" --pr \
            --base "$BASE_SHA" --branch "$HEAD_REF" --pr-json "$RUNNER_TEMP/pr.json"

  guard:
    name: guard (workflow and script changes wait for a security-platform review)
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gh pr view (reviewDecision)
    steps:
      - name: A PR that changes .github/workflows/** or scripts/** needs an approving security-platform review first
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SENSITIVE: ${{ needs.route.outputs.sensitive }}
        run: |
          set -euo pipefail
          if [ "$SENSITIVE" != "true" ]; then
            echo "no change under .github/workflows/ or scripts/"
            exit 0
          fi
          decision=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json reviewDecision --jq '.reviewDecision // ""')
          if [ "$decision" != "APPROVED" ]; then
            echo "::error title=sdlc::this PR changes .github/workflows/** or scripts/** — the code the gates run. lint.yml and review.yml (which would run this PR's own copies with a write token and ANTHROPIC_API_KEY) wait until a security-platform CODEOWNER approves it (reviewDecision: ${decision:-none}); then re-run the failed jobs"
            exit 1
          fi
          echo "reviewDecision APPROVED: the workflow and script changes were reviewed"

  lint:
    name: lint
    needs: [route, guard]
    if: needs.route.outputs.lint == 'true'
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      pull-requests: write

  review:
    name: review
    needs: [route, guard]
    if: needs.route.outputs.review == 'true'
    uses: ./.github/workflows/review.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
      issues: read

  sdlc:
    name: sdlc
    needs: [route, guard, checks, lint, review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: The one required check — green only when everything it depends on is
        env:
          ROUTE: ${{ needs.route.result }}
          GUARD: ${{ needs.guard.result }}
          CHECKS: ${{ needs.checks.result }}
          LINT: ${{ needs.lint.result }}
          REVIEW: ${{ needs.review.result }}
          WANT_LINT: ${{ needs.route.outputs.lint }}
          WANT_REVIEW: ${{ needs.route.outputs.review }}
        run: |
          set -euo pipefail
          fail=0
          [ "$ROUTE" = "success" ]  || { echo "::error title=sdlc::route: $ROUTE"; fail=1; }
          [ "$GUARD" = "success" ]  || { echo "::error title=sdlc::guard: $GUARD (workflow or script changes need a security-platform review first)"; fail=1; }
          [ "$CHECKS" = "success" ] || { echo "::error title=sdlc::lifecycle checks: $CHECKS (see the checks job)"; fail=1; }
          for pair in "lint:$LINT:$WANT_LINT" "review:$REVIEW:$WANT_REVIEW"; do
            name=${pair%%:*}; rest=${pair#*:}; result=${rest%%:*}; wanted=${rest#*:}
            if [ "$wanted" = "true" ] && [ "$result" != "success" ]; then
              echo "::error title=sdlc::${name}.yml: $result"; fail=1
            elif [ "$wanted" != "true" ] && [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
              echo "::error title=sdlc::${name}.yml: $result"; fail=1
            else
              echo "${name}.yml: ${result} (needed: ${wanted:-false})"
            fi
          done
          exit "$fail"
