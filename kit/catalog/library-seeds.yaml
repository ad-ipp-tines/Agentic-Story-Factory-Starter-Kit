# kit/catalog/library-seeds.yaml — the verified Tines Story Library ids.
#
# Spec: REPO-DESIGN.md §11 (the ten starter stories and the two alternates), §4.4 01 discover, §5.3.1, §5.3.12.
#
# THIS IS THE ONLY LIST OF LIBRARY IDS ANY AGENT, PAGE OR SCRIPT MAY CITE.
#   - story-scout cites only ids from this file; any other id it comes across goes into candidate_ids_unverified[]
#     and reaches this file only through a CODEOWNER PR (CODEOWNERS: /kit/** → security-platform).
#   - brief_writer (Tines-side) sees these ids through the kit_catalog Resource, and a Trigger after it drops any
#     candidate_seed_ids that are not here, so the agent cannot introduce an id.
#   - the kickoff and add_use_case Pages build their Option lists from kit_catalog, never from free text.
#   - the lifecycle check discovery_complete fails a discovery note that cites an id not in this file, and
#     `./scripts/storyline check` (catalog_ids_verified) fails a tracker row whose library_seed_id is not here.
#   - `./scripts/kit bundle` copies this file into the kit_catalog Resource; kit-sync.yml keeps the Resource current.
#
# A seed is a starting point to READ, never a story to ship. Importing a seed into the Seeds folder is [BY HAND]
# (the Tines Stories MCP server, Mode 2, cannot import a Library story); the story is then built through the
# lifecycle in the dev team. A reference_only seed is never recommended for shipping, not even adapted.
#
# Names are recorded as the Library shows them. Two names (1321120, 1258068) come from internal research and are
# confirmed on the Library page before use; every id is re-checked against its own Library page on first use
# (VERIFY K43 — the id still resolves, the name matches, the entry action is the one expected).
# Keys per seed:
#   id              the Library story id (a public id, not a tenant id)
#   name            the Library story name as recorded
#   url             the Library page; the only URL story-scout may WebFetch for this seed (settings allow www.tines.com)
#   reference_only  true = read it, never ship it or recommend shipping it
#   name_source     public_library | internal_research (the latter must be confirmed on the Library page first, K43)
#   used_by         the starter-story key(s) in kit/catalog/starter-stories.yaml that start from this seed
#   role            starter | alternate
#   verify          the VERIFY ids that apply before relying on the seed

version: 1
url_template: "https://www.tines.com/library/stories/{id}/"

