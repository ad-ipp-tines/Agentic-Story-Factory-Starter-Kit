  - n: 11                                 # "+" in §11: always seeded, never a Page pick
    key: ops-story-health-monitor
    title: "[OPS] 10 · Monitor story health and credits"
    use_case: "Sweep every production story for failures, silence and credit burn, and propose fixes for a human to approve."
    library_seed_id: null                 # the scaffold's own design
