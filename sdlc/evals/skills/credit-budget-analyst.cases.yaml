# sdlc/evals/skills/credit-budget-analyst.cases.yaml — HELD-OUT cases for the Tines Agent Skill `credit-budget-analyst`.
#
# Spec: REPO-DESIGN.md §15.2, P24. The skill is attached [BY HAND] to the `triage` AI Agent action of
# ops-story-health-monitor, so its cases run through the SAME dev-only triage harness as
# sdlc/evals/skills/story-health-triage.cases.yaml (read its header: the harness is planned, VERIFY K37, and
# sdlc-evals.yml skips this file with a notice until runs_via.entry_action and the story id variable are set).
# The usage rows the skill reasons over are given in the prompt's signals, because the harness's lookup tools reach
# no real story. Output: the triage Output schema. FORMAT and grading: the header of
# sdlc/evals/agents/runtime-planner.cases.yaml.

version: 1
skill: credit-budget-analyst
runs_via:
  story: ops-story-health-monitor
  action: triage
  entry_action: null                  # the harness Webhook's action name, once built (VERIFY K37)
  entry_story_id_env: SKILL_HARNESS_TRIAGE_STORY_ID
  command: "./scripts/sdlc eval-run ops-story-health-monitor --cases sdlc/evals/skills/credit-budget-analyst.cases.yaml --entry-story-id $SKILL_HARNESS_TRIAGE_STORY_ID --entry-action <entry_action>"
defaults:
  k: 3

x-never-touch: &nt { story_ids: [], name_patterns: ["^\\[OPS\\]", "^\\[KIT\\]"] }

variants:
  at-84-percent:
    event:
      story_id: 0
      story_name: "[SEC] 03 · Look up IOCs from Slack with an agent"
      environment: dev
      never_touch: *nt
      signals:
        - { signal: credit_pct_of_budget, value: 84, threshold: 80, budget_daily: 50 }
        - { signal: ai_usage, value: { credits_used: 42, billed_cost: 0, usage_count: 60, top_actions: [ { action_name: lookup_agent, credits_used: 40 }, { action_name: summarise, credits_used: 2 } ] } }
      router_alert: null
      baseline: { credits_per_day_p95: 30, runs_per_day_median: 40 }
      budget: { credit_budget_daily: 50, credit_alert_pct: [80, 95] }
      rejected_proposals: []
  at-97-percent:
    event:
      story_id: 0
      story_name: "[SEC] 03 · Look up IOCs from Slack with an agent"
      environment: dev
      never_touch: *nt
      signals:
        - { signal: credit_pct_of_budget, value: 97, threshold: 95, budget_daily: 50 }
        - { signal: ai_usage, value: { credits_used: 48.5, billed_cost: 0, usage_count: 45, top_actions: [ { action_name: lookup_agent, credits_used: 46 }, { action_name: summarise, credits_used: 2.5 } ] } }
      router_alert: null
      baseline: { credits_per_day_p95: 30, runs_per_day_median: 40 }
      budget: { credit_budget_daily: 50, credit_alert_pct: [80, 95] }
      rejected_proposals: []
  custom-provider:
    event:
      story_id: 0
      story_name: "[PLT] 05 · Research a topic with an agent"
      environment: dev
      never_touch: *nt
      signals:
        - { signal: ai_usage, value: { credits_used: 0, billed_cost: 12.4, usage_count: 30, top_actions: [ { action_name: research, credits_used: 0 } ] } }
      router_alert: null
      baseline: { runs_per_day_median: 25 }
      budget: { credit_budget_daily: 50, credit_alert_pct: [80, 95] }
      rejected_proposals: []
  no-budget:
    event:
      story_id: 0
      story_name: "[PLT] 05 · Research a topic with an agent"
      environment: dev
      never_touch: *nt
      signals:
        - { signal: ai_usage, value: { credits_used: 70, billed_cost: 0, usage_count: 30, top_actions: [ { action_name: research, credits_used: 70 } ] } }
      router_alert: null
      baseline: { runs_per_day_median: 25 }
      budget: { credit_budget_daily: null, credit_alert_pct: [80, 95] }
      rejected_proposals: []

cases:
  - id: credit-80-summarises-without-pausing
    suite: capability
    kind: model_graded
    held_out: true
    input_ref: "sdlc/evals/skills/credit-budget-analyst.cases.yaml#variants.at-84-percent"
    should_trigger: true
    expect: { must_fire: [triage] }
    output_checks:
      - { path: category, equals: credit_burn }
      - { path: severity, equals: medium }
      - { path: proposed_change.kind, equals: credit_action }
    k: 3

  - id: credit-95-names-exactly-one-action
    suite: capability
    kind: model_graded
    held_out: true
    input_ref: "sdlc/evals/skills/credit-budget-analyst.cases.yaml#variants.at-97-percent"
    should_trigger: true
    expect: { must_fire: [triage] }
    output_checks:
      - { path: severity, equals: high }
      - { path: needs_human, equals: true }
      - { path: proposed_change.kind, equals: credit_action }
      - { path: proposed_change.target, equals: lookup_agent }
    k: 3

  - id: credit-custom-provider-is-not-free
    suite: regression
    kind: model_graded
    held_out: true
    input_ref: "sdlc/evals/skills/credit-budget-analyst.cases.yaml#variants.custom-provider"
    should_trigger: true
    expect: { must_fire: [triage] }
    output_checks:
      - { path: "$", text_not_contains: ["is free", "no cost"] }
    rubric: >-
      Pass only if the output reports billed cost rather than credits, says the credit budget does not apply to a
      custom provider, and never adds credits and billed cost together.
    reference_output: { category: credit_burn, severity: low, proposed_change: { kind: none }, root_cause_hypothesis: "The story runs on a custom provider: 0 credits, 12.4 billed externally; the credit budget does not apply." }
    k: 3

  - id: credit-no-budget-means-no-threshold
    suite: regression
    kind: model_graded
    held_out: true
    input_ref: "sdlc/evals/skills/credit-budget-analyst.cases.yaml#variants.no-budget"
    should_trigger: true
    expect: { must_fire: [triage] }
    output_checks:
      - { path: needs_human, equals: true }
      - { path: proposed_change.kind, not_equals: credit_action }
    k: 3
